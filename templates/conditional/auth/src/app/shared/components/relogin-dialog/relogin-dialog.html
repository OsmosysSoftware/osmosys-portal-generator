<p-dialog
  [visible]="reloginService.showDialog()"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  header="Session Expired"
  [style]="{ width: '420px' }"
>
  <div class="text-center mb-4">
    <i class="pi pi-lock" style="font-size: 2.5rem; color: var(--primary-color)"></i>
    <p class="mt-3 mb-1">Your session expired. Sign in again to continue.</p>
    <p class="text-sm" style="color: var(--text-color-secondary)">Your work is preserved.</p>
  </div>

  @if (errorMessage()) {
    <p-message severity="error" [text]="errorMessage()" styleClass="mb-4 w-full" />
  }

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="relogin-email" class="block font-medium mb-2">Email</label>
      <input
        pInputText
        id="relogin-email"
        name="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        [disabled]="loading()"
        class="w-full"
      />
    </div>

    <div class="mb-4">
      <label for="relogin-password" class="block font-medium mb-2">Password</label>
      <p-password
        id="relogin-password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [toggleMask]="true"
        [fluid]="true"
        [feedback]="false"
        [disabled]="loading()"
        placeholder="Enter your password"
      />
    </div>

    <div class="flex gap-2">
      <p-button
        label="Sign In"
        type="submit"
        [loading]="loading()"
        styleClass="flex-1"
        icon="pi pi-sign-in"
      />
      <p-button
        label="Logout"
        severity="secondary"
        styleClass="flex-1"
        icon="pi pi-sign-out"
        [disabled]="loading()"
        (onClick)="onLogout()"
      />
    </div>
  </form>
</p-dialog>
